<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ v.number }} · PDF-Lesefassung · {{ app_name }}</title><style>
body{min-height:100vh;display:flex;flex-direction:column;margin:0;background:#e6ebed;color:#172d3c;font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:1;padding:.7rem;background:#163c47;color:#fff;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}header a{color:#fff}button,select,input{font:inherit;padding:.4rem;max-width:90px}button{cursor:pointer;background:#fff;color:#163c47;border:0;border-radius:3px}button:disabled{opacity:.5}main{padding:1rem;overflow:auto;text-align:center}canvas{display:block;margin:auto;background:white;box-shadow:0 2px 10px #0002}#status{padding:.5rem;margin:0}details{background:#fff;text-align:left;padding:1rem;margin:1rem auto;max-width:1000px}pre{white-space:pre-wrap;font:inherit;line-height:1.6}header strong{margin-right:auto}label{display:flex;align-items:center;gap:.3rem}
</style>{% include 'dms/branding_head.html' %}</head><body><header><a class="site-brand viewer-brand" href="{% url 'home' %}" target="_top" aria-label="{{ app_name }} · Dokumentenübersicht"><img class="site-logo" src="{% url 'branding_asset' 'logo.png' %}?v={{ brand_revision }}" width="42" height="42" alt="Logo: {{ app_name }}"></a><strong>{{ v.number }} · {{ v.major }}.{{ v.minor }}</strong><button id="previous" disabled aria-label="Vorherige Seite">←</button><label>Seite <input id="page" type="number" min="1" value="1" aria-label="Seitenzahl"></label><span id="pages"></span><button id="next" disabled aria-label="Nächste Seite">→</button><label>Zoom <select id="zoom"><option value="auto">Passend</option><option value="1">100 %</option><option value="1.5">150 %</option><option value="2">200 %</option></select></label><a href="{% url 'preview_pdf' v.id file_id %}?download=1">PDF herunterladen</a></header><p id="status" role="status">PDF-Lesefassung wird geladen …</p><main id="viewer" data-source="{% url 'preview_pdf' v.id file_id %}" data-assets="{% url 'pdfjs_asset' 'pdf.mjs' %}"><canvas id="pdf-canvas" role="img" aria-label="Dokumentseite"></canvas><details><summary>Text dieser Seite anzeigen</summary><pre id="page-text"></pre></details></main><noscript><p>Für die Vorschau JavaScript aktivieren oder die PDF-Lesefassung herunterladen.</p></noscript>{% include 'dms/footer.html' %}<script type="module" src="{% url 'pdfjs_asset' 'viewer.mjs' %}?integration=1"></script></body></html>
