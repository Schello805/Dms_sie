name: Application quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-postgres
      PGDATABASE: postgres
      DMS_SECRET_KEY: ci-only-synthetic-secret
      DMS_DEBUG: '1'
      DMS_INTERNAL_HTTP: '1'
      DMS_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DMS_DEMO_PASSWORD: CI-Only-Strong-Password-2026!
      CI_APP_PASSWORD: CI-Only-App-Password-2026!
      DMS_MEDIA_ROOT: /tmp/ims-ci-files
      DMS_ERROR_LOG_DIR: /tmp/ims-ci-errors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: pip install -r requirements.lock.txt ruff==0.14.5
      - name: Static checks
        run: |
          python -m compileall -q config dms scripts tests
          ruff check --select E9,F63,F7,F82 config dms scripts tests
          node --check dms/static/dms/app.js
          node --check dms/static/dms/catalog.js
          node tests/test_catalog_live.cjs
      - name: PostgreSQL application tests
        run: python manage.py test dms --noinput -v 2
      - name: Installer unit tests
        run: python -m unittest discover -s tests -p test_linux_installer.py -v
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-postgres
      PGDATABASE: postgres
      DMS_SECRET_KEY: ci-only-synthetic-secret
      DMS_DEBUG: '1'
      DMS_INTERNAL_HTTP: '1'
      DMS_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DMS_DEMO_PASSWORD: CI-Only-Strong-Password-2026!
      CI_APP_PASSWORD: CI-Only-App-Password-2026!
      DMS_MEDIA_ROOT: /tmp/ims-ci-files
      DMS_ERROR_LOG_DIR: /tmp/ims-ci-errors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Browser dependencies
        run: pip install -r requirements.lock.txt playwright==1.64.1
      - name: Isolated browser fixtures
        run: |
          python scripts/ci_prepare.py
          python manage.py profile_catalog leser > catalog-profile.json
      - name: Use official HTTPS Ubuntu package mirrors on the CI runner
        run: |
          cat > /tmp/ims-ubuntu.sources <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo install -m 0644 /tmp/ims-ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources
      - name: Install browser on CI runner
        run: python -m playwright install --with-deps chromium
      - name: Browser tests with restricted runtime role
        env:
          PGUSER: ims_ci_app
          PGPASSWORD: CI-Only-App-Password-2026!
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/ims-ci-web.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/login/ > /dev/null && break; sleep 1; done
          python tests/browser/run.py
      - name: Runtime diagnostics on failure
        if: failure()
        run: test ! -f /tmp/ims-ci-web.log || tail -100 /tmp/ims-ci-web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-query-reports
          path: |
            test-results/
            catalog-profile.json
