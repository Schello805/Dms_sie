name: Linux installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/install_linux.py'
      - 'scripts/linux_manage.py'
      - 'scripts/linux_backup.py'
      - 'dms/management/commands/bootstrap_admin.py'
      - 'requirements.lock.txt'
      - 'db/**'
      - 'config/settings.py'
      - 'dms/test_proxy_login.py'
      - 'tests/proxy_login_smoke.py'
      - '.github/workflows/linux-install.yml'
permissions:
  contents: read
jobs:
  ubuntu-install-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Installer unit tests
        run: python3 -m unittest discover -s tests -p 'test_linux_installer.py' -v
      - name: Use official HTTPS Ubuntu package mirrors on the CI runner
        run: |
          cat > /tmp/ims-ubuntu.sources <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo install -m 0644 /tmp/ims-ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources
      - name: Fresh local-source installation
        env:
          INSTALL_REPO: https://github.com/${{ github.repository }}
        run: sudo python3 scripts/install_linux.py --non-interactive --host dms.proxy.test --source-dir "$GITHUB_WORKSPACE" --repo "$INSTALL_REPO"
      - name: Health and bootstrap checks
        run: |
          curl --fail http://localhost/ > /tmp/ims-home.html
          grep -q Dokumentenübersicht /tmp/ims-home.html
          sudo systemctl is-active ims-dms ims-dms-index ims-dms-notifications
          sudo ims-dms-manage check
          curl --fail -H "Host: 192.168.99.12" http://localhost/ > /dev/null
          curl --fail -H "Host: 192.168.99.99" http://localhost/ > /dev/null
          sudo systemctl start ims-dms-backup.service
      - name: HTTPS-origin login through internal HTTP
        run: sudo python3 tests/proxy_login_smoke.py
      - name: Update with mandatory backup
        run: sudo python3 scripts/install_linux.py --update --source-dir "$GITHUB_WORKSPACE"
      - name: Health after update
        run: |
          curl --fail http://localhost/ > /dev/null
          sudo test -f /etc/ims-dms/initial-admin-password
          sudo systemctl is-active ims-dms-backup.timer
      - name: HTTPS-origin login after update
        run: sudo python3 tests/proxy_login_smoke.py
      - name: Service diagnostics on failure
        if: failure()
        run: sudo journalctl -u ims-dms -u ims-dms-index -u ims-dms-notifications --no-pager -n 80
