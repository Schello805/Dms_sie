# Example: replace host name and certificate paths before installation.
# limit_req_zone belongs in nginx's http context (sites-enabled is normally included there).
limit_req_zone $binary_remote_addr zone=dms_login:10m rate=5r/m;
server {
    listen 80;
    server_name dms.example.internal;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name dms.example.internal;
    ssl_certificate /etc/ssl/dms/fullchain.pem;
    ssl_certificate_key /etc/ssl/dms/privkey.pem;
    client_max_body_size 27m;
    location = /login/ {
        limit_req zone=dms_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # No public location for private document files.
}
