# Explicitly selected internal HTTP deployment. Include in nginx's http context.
# Adjust the login limit to your actual NAT/shift-change traffic before activation.
limit_req_zone $binary_remote_addr zone=dms_http_login:10m rate=120r/m;
server {
    listen 80;
    server_name dms.example.internal;
    client_max_body_size 30m;
    location = /login/ {
        limit_req zone=dms_http_login burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    # No public MEDIA location; the app checks access for every file.
}
